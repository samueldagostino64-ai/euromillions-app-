name: Message hebdomadaire

on:
  schedule:
    # Lundi 11:00 UTC = 8h en Guyane, 12h/13h à Paris
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Préparer les grilles de la semaine
        env:
          NOTIFY: ${{ github.repository_owner }}
        run: node scripts/weekly.mjs
      - name: Publier (GitHub envoie l'e-mail)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create grilles --color 2a78d6 --description "Grilles hebdomadaires" 2>/dev/null || true
          for n in $(gh issue list --label grilles --state open --json number -q '.[].number'); do gh issue close "$n"; done
          gh issue create --title "$(cat weekly-title.txt)" --body-file weekly-body.md --label grilles --assignee "${{ github.repository_owner }}"
