name: Mise à jour des tirages

on:
  schedule:
    # Tirages mardi et vendredi vers 21h (Paris). Passage le soir même puis le lendemain matin.
    - cron: "30 22 * * 2,5"
    - cron: "0 7 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger l'historique FDJ
        run: python scripts/update_draws.py
      - name: Enregistrer s'il y a du nouveau
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "Pas de nouveau tirage."
          else
            git commit -m "Tirages : $(tail -n1 data/draws.csv | cut -d';' -f1)"
            git push
          fi
